config:
  validation: true
  warningsAsErrors: false
  excludes: []

comments:
  active: true
  AbsentOrWrongFileLicense: { active: false }
  DocumentationOverPrivateFunction: { active: false }
  DocumentationOverPrivateProperty: { active: false }
  DeprecatedBlockTag: { active: false }
  EndOfSentenceFormat:
    active: false
    endOfSentenceFormat: '([.?!][ \t\n\r\f<])|([.?!:]$)'
  KDocReferencesNonPublicProperty: { active: false }
  OutdatedDocumentation:
    active: false
    matchTypeParameters: true
    matchDeclarationsOrder: true
    allowParamOnConstructorProperties: false
  UndocumentedPublicClass:
    active: false
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
  UndocumentedPublicFunction: { active: false }
  UndocumentedPublicProperty: { active: false }

complexity:
  active: true
  ComplexCondition:
    active: true
    allowedConditions: 4
  ComplexInterface:
    active: false
    allowedDefinitions: 10
    includeStaticDeclarations: false
    includePrivateDeclarations: false
  CyclomaticComplexMethod:
    active: true
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    nestingFunctions: [also, apply, forEach, isNotNull, ifNull, let, run, use, with]
  LabeledExpression:
    active: false
    ignoredLabels: []
  LargeClass:
    active: true
    allowedLines: 800
    excludes: ['**/test/**']
  LongMethod:
    active: true
    allowedLines: 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 8
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  MethodOverloading:
    active: false
    allowedOverloads: 6
  NamedArguments:
    active: false
    allowedArguments: 3
    ignoreArgumentsMatchingNames: false
  NestedBlockDepth:
    active: true
    allowedDepth: 4
  NestedScopeFunctions:
    active: false
    allowedDepth: 1
    functions: [kotlin.apply, kotlin.run, kotlin.with, kotlin.let, kotlin.also]
  ReplaceSafeCallChainWithRun: { active: false }
  StringLiteralDuplication:
    active: false
    allowedDuplications: 3
    ignoreAnnotation: true
    allowedWithLengthLessThan: 5
    ignoreStringsRegex: '$^'
  TooManyFunctions:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jsTest/**', '**/iosTest/**']
    allowedFunctionsPerFile: 15
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 15
    allowedFunctionsPerEnum: 15
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false

coroutines:
  active: true
  GlobalCoroutineUsage: { active: false }
  InjectDispatcher:
    active: true
    dispatcherNames: [IO, Default, Unconfined]
  RedundantSuspendModifier: { active: true }
  SleepInsteadOfDelay: { active: true }
  SuspendFunWithCoroutineScopeReceiver: { active: false }
  SuspendFunWithFlowReturnType: { active: true }

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  EmptyClassBlock: { active: true }
  EmptyDefaultConstructor: { active: true }
  EmptyDoWhileBlock: { active: true }
  EmptyElseBlock: { active: true }
  EmptyFinallyBlock: { active: true }
  EmptyForBlock: { active: true }
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: false
  EmptyIfBlock: { active: true }
  EmptyInitBlock: { active: true }
  EmptyKotlinFile: { active: true }
  EmptySecondaryConstructor: { active: true }
  EmptyTryBlock: { active: true }
  EmptyWhenBlock: { active: true }
  EmptyWhileBlock: { active: true }

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
    methodNames: [equals, finalize, hashCode, toString]
  InstanceOfCheckForException: { active: true }
  NotImplementedDeclaration: { active: false }
  ObjectExtendsThrowable: { active: false }
  PrintStackTrace: { active: true }
  RethrowCaughtException: { active: true }
  ReturnFromFinally:
    active: true
    ignoreLabeled: false
  SwallowedException:
    active: true
    ignoredExceptionTypes: [InterruptedException, MalformedURLException, NumberFormatException, ParseException]
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  ThrowingExceptionFromFinally: { active: true }
  ThrowingExceptionInMain: { active: false }
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
    exceptions: [ArrayIndexOutOfBoundsException, Exception, IllegalArgumentException, IllegalMonitorStateException, IllegalStateException, IndexOutOfBoundsException, NullPointerException, RuntimeException, Throwable]
  ThrowingNewInstanceOfSameException: { active: true }
  TooGenericExceptionCaught:
    active: true
    exceptionNames: [ArrayIndexOutOfBoundsException, Error, Exception, IllegalMonitorStateException, IndexOutOfBoundsException, NullPointerException, RuntimeException, Throwable]
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  TooGenericExceptionThrown:
    active: true
    exceptionNames: [Error, Exception, RuntimeException, Throwable]

naming:
  active: true
  BooleanPropertyNaming:
    active: false
    allowedPattern: '^(is|has|are)'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    privateParameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  EnumNaming:
    active: true
    enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
  ForbiddenClassName: { active: false, forbiddenName: [] }
  FunctionNameMaxLength: { active: false, maximumFunctionNameLength: 30 }
  FunctionNameMinLength: { active: false, minimumFunctionNameLength: 3 }
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  InvalidPackageDeclaration:
    active: true
    rootPackage: ''
    requireRootInDeclaration: false
  LambdaParameterNaming: { active: false, parameterPattern: '[a-z][A-Za-z0-9]*|_' }
  MatchingDeclarationName: { active: true, mustBeFirst: true }
  MemberNameEqualsClassName: { active: true, ignoreOverridden: true }
  NoNameShadowing: { active: true }
  NonBooleanPropertyPrefixedWithIs: { active: false }
  ObjectPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '(_)?[A-Za-z][_A-Za-z0-9]*'
  PackageNaming: { active: true, packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*' }
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  VariableMaxLength: { active: false, maximumVariableNameLength: 64 }
  VariableMinLength: { active: false, minimumVariableNameLength: 1 }
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'

performance:
  active: true
  ArrayPrimitive: { active: true }
  CouldBeSequence: { active: false, allowedOperations: 3 }
  ForEachOnRange: { active: true }
  SpreadOperator: { active: true }
  UnnecessaryTemporaryInstantiation: { active: true }

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
    forbiddenTypePatterns: [kotlin.String]
  CastToNullableType: { active: false }
  Deprecation: { active: false }
  DontDowncastCollectionTypes: { active: false }
  DoubleMutabilityForCollection:
    active: true
    mutableTypes: [kotlin.collections.MutableList, kotlin.collections.MutableMap, kotlin.collections.MutableSet, java.util.ArrayList, java.util.LinkedHashSet, java.util.HashSet, java.util.LinkedHashMap, java.util.HashMap]
  ElseCaseInsteadOfExhaustiveWhen: { active: false }
  EqualsAlwaysReturnsTrueOrFalse: { active: true }
  EqualsWithHashCodeExist: { active: true }
  ExitOutsideMain: { active: false }
  ExplicitGarbageCollectionCall: { active: true }
  HasPlatformType: { active: true }
  IgnoredReturnValue:
    active: true
    restrictToConfig: true
    returnValueAnnotations: ['*.CheckResult', '*.CheckReturnValue']
    ignoreReturnValueAnnotations: ['*.CanIgnoreReturnValue']
    ignoreFunctionCall: []
  ImplicitDefaultLocale: { active: true }
  ImplicitUnitReturnType: { active: false, allowExplicitReturnType: true }
  InvalidRange: { active: true }
  IteratorHasNextCallsNextMethod: { active: true }
  IteratorNotThrowingNoSuchElementException: { active: true }
  LateinitUsage: { active: false, ignoreOnClassesPattern: '' }
  MapGetWithNotNullAssertionOperator: { active: true }
  MissingPackageDeclaration: { active: false, excludes: ['**/*.kts'] }
  NullCheckOnMutableProperty: { active: false }
  NullableToStringCall: { active: false }
  UnconditionalJumpStatementInLoop: { active: false }
  UnnecessaryNotNullOperator: { active: true }
  UnnecessarySafeCall: { active: true }
  UnreachableCatchBlock: { active: true }
  UnreachableCode: { active: true }
  UnsafeCallOnNullableType: { active: true }
  UnsafeCast: { active: true }
  UnusedUnaryOperator: { active: true }
  UselessPostfixExpression: { active: true }
  WrongEqualsTypeParameter: { active: true }

style:
  active: true
  CanBeNonNullable: { active: false }
  CascadingCallWrapping: { active: false, includeElvis: true }
  ClassOrdering: { active: false }
  CollapsibleIfStatements: { active: false }
  DataClassContainsFunctions: { active: false, conversionFunctionPrefix: [to] }
  DataClassShouldBeImmutable: { active: false }
  DestructuringDeclarationWithTooManyEntries: { active: true, maxDestructuringEntries: 3 }
  EqualsNullCall: { active: true }
  EqualsOnSignatureLine: { active: false }
  ExplicitCollectionElementAccessMethod: { active: false }
  ExplicitItLambdaParameter: { active: true }
  ExpressionBodySyntax: { active: false, includeLineWrapping: false }
  ForbiddenComment:
    active: true
    comments:
      - { reason: 'Forbidden FIXME todo marker in comment, please fix the problem.', value: 'FIXME:' }
      - { reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.', value: 'STOPSHIP:' }
      - { reason: 'Forbidden TODO todo marker in comment, please do the changes.', value: 'TODO:' }
    allowedPatterns: ''
  ForbiddenImport: { active: false, forbiddenImports: [], allowedImports: [] }
  ForbiddenMethodCall:
    active: false
    methods:
      - { reason: 'print does not allow you to configure the output stream. Use a logger instead.', value: kotlin.io.print }
      - { reason: 'println does not allow you to configure the output stream. Use a logger instead.', value: kotlin.io.println }
  ForbiddenSuppress: { active: false, rules: [] }
  ForbiddenVoid: { active: true, ignoreOverridden: false, ignoreUsageInGenerics: false }
  FunctionOnlyReturningConstant:
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true
    excludedFunctions: []
  LoopWithTooManyJumpStatements: { active: true, maxJumpCount: 1 }
  MagicNumber:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts']
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true
  BracesOnIfStatements: { active: false, singleLine: never, multiLine: always }
  BracesOnWhenStatements: { active: false, singleLine: necessary, multiLine: consistent }
  MandatoryBracesLoops: { active: false }
  MaxChainedCallsOnSameLine: { active: false, maxChainedCalls: 5 }
  MaxLineLength:
    active: true
    maxLineLength: 180
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  MayBeConstant: { active: true }
  ModifierOrder: { active: true }
  MultilineLambdaItParameter: { active: false }
  NestedClassesVisibility: { active: true }
  NewLineAtEndOfFile: { active: true }
  NoTabs: { active: false }
  NullableBooleanCheck: { active: false }
  ObjectLiteralToLambda: { active: true }
  OptionalAbstractKeyword: { active: true }
  OptionalUnit: { active: false }
  ProtectedMemberInFinalClass: { active: true }
  RedundantExplicitType: { active: false }
  RedundantHigherOrderMapUsage: { active: true }
  RedundantVisibilityModifier: { active: false }
  ReturnCount:
    active: true
    max: 2
    excludedFunctions: [equals]
    excludeLabeled: false
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  SafeCast: { active: true }
  SerialVersionUIDInSerializableClass: { active: true }
  SpacingAfterPackageAndImports: { active: false }
  ThrowsCount: { active: true, max: 2, excludeGuardClauses: true }
  TrailingWhitespace: { active: false }
  UnderscoresInNumericLiterals: { active: false, acceptableLength: 4, allowNonStandardGrouping: false }
  AbstractClassCanBeConcreteClass: { active: true }
  AbstractClassCanBeInterface: { active: true }
  UnnecessaryApply: { active: true }
  UnnecessaryBackticks: { active: false }
  UnnecessaryFilter: { active: true }
  UnnecessaryInheritance: { active: true }
  UnnecessaryInnerClass: { active: false }
  UnnecessaryLet: { active: false }
  UnnecessaryParentheses: { active: false }
  RangeUntilInsteadOfRangeTo: { active: false }
  UnusedImport: { active: false }
  UnusedPrivateClass: { active: true }
  UnusedPrivateFunction:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  UseAnyOrNoneInsteadOfFind: { active: true }
  UseArrayLiteralsInAnnotations: { active: true }
  UseCheckNotNull: { active: true }
  UseCheckOrError: { active: true }
  UseDataClass: { active: false, allowVars: false }
  UseEmptyCounterpart: { active: false }
  UseIfEmptyOrIfBlank: { active: false }
  UseIfInsteadOfWhen: { active: false }
  UseIsNullOrEmpty: { active: true }
  UseOrEmpty: { active: true }
  UseRequire: { active: true }
  UseRequireNotNull: { active: true }
  UselessCallOnNotNull: { active: true }
  UtilityClassWithPublicConstructor: { active: true }
  VarCouldBeVal: { active: true, ignoreLateinitVar: false }
  WildcardImport:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jsTest/**', '**/iosTest/**']
    excludeImports: ['java.util.*']

ktlint:
  active: true
  code_style: intellij_idea
  indentStyle: space
  autoCorrect: true
  AnnotationOnSeparateLine: { active: false, autoCorrect: true }
  AnnotationSpacing: { active: false, autoCorrect: true }
  ArgumentListWrapping: { active: false, autoCorrect: true, indentSize: 4, maxLineLength: 180 }
  BinaryExpressionWrapping: { active: true, autoCorrect: true, indentSize: 4, maxLineLength: 180 }
  ClassSignature:
    active: true
    autoCorrect: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: '1'
    indentSize: 4
    maxLineLength: 180
  BlockCommentInitialStarAlignment: { active: false, autoCorrect: true }
  ChainWrapping: { active: true, autoCorrect: true }
  CommentSpacing: { active: true, autoCorrect: true }
  CommentWrapping: { active: false, autoCorrect: true, indentSize: 4 }
  DiscouragedCommentLocation: { active: false, autoCorrect: true }
  EnumEntryNameCase: { active: false, autoCorrect: true }
  Filename: { active: true }
  FinalNewline: { active: true, autoCorrect: true, insertFinalNewLine: true }
  FunKeywordSpacing: { active: false, autoCorrect: true }
  FunctionLiteral: { active: true, autoCorrect: true, indentSize: 4, maxLineLength: 180 }
  FunctionSignature: { active: true, autoCorrect: true, indentSize: 4, maxLineLength: 180 }
  FunctionTypeReferenceSpacing: { active: false, autoCorrect: true }
  ImportOrdering:
    active: true
    autoCorrect: true
    layout: '*,java.**,javax.**,kotlin.**,^'
  Indentation: { active: true, autoCorrect: true, indentSize: 4 }
  KdocWrapping: { active: false, autoCorrect: true, indentSize: 4 }
  MaximumLineLength: { active: true, maxLineLength: 180, ignoreBackTickedIdentifier: false }
  ModifierListSpacing: { active: false, autoCorrect: true }
  ModifierOrdering: { active: true, autoCorrect: true }
  MultiLineIfElse: { active: false, autoCorrect: true }
  NoBlankLineBeforeRbrace: { active: true, autoCorrect: true }
  NoConsecutiveBlankLines: { active: true, autoCorrect: true }
  NoEmptyClassBody: { active: true, autoCorrect: true }
  NoEmptyFirstLineInMethodBlock: { active: false, autoCorrect: true }
  NoLineBreakAfterElse: { active: true, autoCorrect: true }
  NoLineBreakBeforeAssignment: { active: true, autoCorrect: true }
  NoMultipleSpaces: { active: true, autoCorrect: true }
  NoSemicolons: { active: true, autoCorrect: true }
  NoTrailingSpaces: { active: true, autoCorrect: true }
  NoUnitReturn: { active: true, autoCorrect: true }
  NoUnusedImports: { active: true, autoCorrect: true }
  NoWildcardImports:
    active: true
    packagesToUseImportOnDemandProperty: 'java.util.*,kotlinx.android.synthetic.**'
  PackageName: { active: false, autoCorrect: true }
  ParameterListWrapping: { active: true, autoCorrect: true, maxLineLength: 180 }
  SpacingAroundAngleBrackets: { active: false, autoCorrect: true }
  SpacingAroundColon: { active: true, autoCorrect: true }
  SpacingAroundComma: { active: true, autoCorrect: true }
  SpacingAroundCurly: { active: true, autoCorrect: true }
  SpacingAroundDot: { active: true, autoCorrect: true }
  SpacingAroundDoubleColon: { active: false, autoCorrect: true }
  SpacingAroundKeyword: { active: true, autoCorrect: true }
  SpacingAroundOperators: { active: true, autoCorrect: true }
  SpacingAroundParens: { active: true, autoCorrect: true }
  SpacingAroundRangeOperator: { active: true, autoCorrect: true }
  SpacingAroundUnaryOperator: { active: false, autoCorrect: true }
  SpacingBetweenDeclarationsWithAnnotations: { active: false, autoCorrect: true }
  SpacingBetweenDeclarationsWithComments: { active: false, autoCorrect: true }
  StringTemplate: { active: true, autoCorrect: true }
  TypeArgumentListSpacing: { active: false, autoCorrect: true }
  UnnecessaryParenthesesBeforeTrailingLambda: { active: false, autoCorrect: true }
  Wrapping: { active: false, autoCorrect: true }
  PropertyWrapping: { active: false, autoCorrect: true }
